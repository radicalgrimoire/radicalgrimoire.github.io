---
layout: default
---
{% if page.collection == "docs" %}
<article class="post-article docs-article">
  {% include breadcrumbs.html %}
  <header class="post-header">
    <div class="post-header-content">
      <h1 class="post-title">{{ page.title | escape }}</h1>
      {% if page.section %}<div class="post-meta"><span class="docs-article-section">{{ page.section | escape }}</span></div>{% endif %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
{% else %}
<article>
  {% include breadcrumbs.html %}
  <header><h1><a href="{{ page.url | relative_url }}">{{ page.title }}</a></h1></header>
  {{ content }}
</article>
{% endif %}
