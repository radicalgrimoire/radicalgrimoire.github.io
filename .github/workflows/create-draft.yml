name: Create draft

on:
  workflow_dispatch:
    inputs:
      year:
        description: "記事の年（年・月・日をすべて空欄にすると実行日の日本時間を使用）"
        required: false
        type: string
      month:
        description: "記事の月（年・月・日をすべて空欄にすると実行日の日本時間を使用）"
        required: false
        type: string
      day:
        description: "記事の日（年・月・日をすべて空欄にすると実行日の日本時間を使用）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create draft
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_DAY: ${{ inputs.day }}
        shell: pwsh
        run: |
          $japanDate = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), "Tokyo Standard Time")
          $dateInputs = @($env:INPUT_YEAR, $env:INPUT_MONTH, $env:INPUT_DAY)
          $providedDateInputs = @($dateInputs | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($providedDateInputs.Count -eq 3) {
            ./.github/create-draft.ps1 -Year $env:INPUT_YEAR -Month $env:INPUT_MONTH -Day $env:INPUT_DAY
          } elseif ($providedDateInputs.Count -eq 0) {
            ./.github/create-draft.ps1 -Year $japanDate.Year -Month $japanDate.Month -Day $japanDate.Day
          } else {
            throw "年・月・日はすべて入力するか、すべて空欄にしてください。"
          }

      - name: Commit draft
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _drafts
          git commit -m "Create draft"
          git push