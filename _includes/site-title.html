{%- assign title_suffix = site.title | slice: -4, 4 -%}
{%- if title_suffix == "Logs" -%}
  {%- assign title_prefix_length = site.title | size | minus: 4 -%}
  {{- site.title | slice: 0, title_prefix_length | escape -}}<span class="site-title-accent">Logs</span>
{%- else -%}
  {{- site.title | escape -}}
{%- endif -%}
