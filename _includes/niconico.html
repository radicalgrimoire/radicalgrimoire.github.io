{% assign video_id = include.url | split: '/' | last | split: '?' | first | split: '#' | first %}
<div style="position: relative; margin: 1.5em 0; padding-bottom: 56.25%;">
  <iframe style="position: absolute;" src="https://embed.nicovideo.jp/watch/{{ video_id | url_encode }}" width="100%" height="100%" frameborder="0" allowfullscreen title="{{ include.title | default: 'ニコニコ動画' | escape }}">
    <a href="{{ include.url | escape }}">{{ include.title | default: 'ニコニコ動画を見る' | escape }}</a>
  </iframe>
</div>
