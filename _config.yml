title: "GadgetLogs"
author: "radicalgrimoire"
description: "I am the most fucking engineer."
timezone: "Asia/Tokyo"
permalink: /:year:month:day-:title/
lang: "en"
excerpt_separator: "<!--more-->"
date_format: "%B %d, %Y"
paginate: 5 # 1ページあたりの記事数
paginate_path: "/page:num/"

# Layout
show_excerpts: true        # show the latest notes on the home page
show_frame: true           # use the original dark header and footer styles
minimal: false             # use a dark header

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
  - title: "Logs"
    children:
      - {file: "archive.html", title: "DailyLogs"}
      - {file: "documents.md", title: "Documents"}
  - {file: "README.md"}

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Github, icon: github, url: "https://github.com/radicalgrimoire"}
  - {title: Subscribe, icon: rss, url: "/feed.xml"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
 - jekyll-feed

collections:
  docs:
    output: true
    permalink: /docs/:path/
